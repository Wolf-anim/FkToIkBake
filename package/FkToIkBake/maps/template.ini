; FkToIkBake rig map template - copy and fill in for any rig.
;
; One [section] per limb.  Section names are what you pass to -limb.
;
; REQUIRED
;   type         arm | leg
;   fkUpper/Mid/End   nodes carrying the FK pose. Use the FK JOINTS (or any
;                     transform whose orientation matches the IK joints when
;                     the limbs are matched).
;   ikUpper/Mid/End   joints of the IK chain (driven by the ikHandle).
;                     Single-chain rigs (FK and IK blend on the same joints):
;                     use the same joints for fk* and ik* AND give the switch,
;                     the tool then evaluates FK with the switch at switchFk and
;                     calibrates with it at switchIk.
;   ikControl         IK wrist / foot control (gets translate + rotate keys)
;   poleControl       pole vector control (gets translate keys)
;
; OPTIONAL
;   mode         position (default) | rotation   ("rotation" = mocap mode:
;                elbow/knee plane from the FK elbow ROTATION; best for
;                nearly straight limbs and mocap)
;   switchAttr   node.attribute of the IK/FK switch
;   switchFk / switchIk   values of the switch for FK and IK (e.g. 0 / 1 or 0 / 10)
;   poleDistance pole distance from the limb axis (default: keep the rig's)
;   straightLow / straightHigh   position mode straight-limb fallback band
;                (elbow offset / limb length; defaults arm 0.001-0.006, leg 0.0015-0.008)

[L_arm]
type        = arm
mode        = position
fkUpper     = L_shoulder_FK_jnt
fkMid       = L_elbow_FK_jnt
fkEnd       = L_wrist_FK_jnt
ikUpper     = L_shoulder_IK_jnt
ikMid       = L_elbow_IK_jnt
ikEnd       = L_wrist_IK_jnt
ikControl   = L_arm_IK_ctrl
poleControl = L_arm_pole_ctrl
switchAttr  = L_arm_settings_ctrl.ikFk
switchFk    = 0
switchIk    = 1
