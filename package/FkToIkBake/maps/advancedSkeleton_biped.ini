; FkToIkBake rig map - Advanced Skeleton biped (default AS naming).
; VERIFY these names on your character before the first bake: AS versions
; and custom builds can differ.  Run with:  fkToIkBake -rigMap "<this file>" -namespace "char:" -validate
;
; fk*  : the FK-driven JOINTS (FKX...), not the FK curve controls.
; ik*  : the IK-driven JOINTS (IKX...).
; AS FKIKBlend: 0 = FK, 10 = IK.
; Keep IK foot roll / heel / toe attributes at their rest value while baking legs.

[R_arm]
type        = arm
mode        = position
fkUpper     = FKXShoulder_R
fkMid       = FKXElbow_R
fkEnd       = FKXWrist_R
ikUpper     = IKXShoulder_R
ikMid       = IKXElbow_R
ikEnd       = IKXWrist_R
ikControl   = IKArm_R
poleControl = PoleArm_R
switchAttr  = FKIKArm_R.FKIKBlend
switchFk    = 0
switchIk    = 10

[L_arm]
type        = arm
mode        = position
fkUpper     = FKXShoulder_L
fkMid       = FKXElbow_L
fkEnd       = FKXWrist_L
ikUpper     = IKXShoulder_L
ikMid       = IKXElbow_L
ikEnd       = IKXWrist_L
ikControl   = IKArm_L
poleControl = PoleArm_L
switchAttr  = FKIKArm_L.FKIKBlend
switchFk    = 0
switchIk    = 10

[R_leg]
type        = leg
mode        = position
fkUpper     = FKXHip_R
fkMid       = FKXKnee_R
fkEnd       = FKXAnkle_R
ikUpper     = IKXHip_R
ikMid       = IKXKnee_R
ikEnd       = IKXAnkle_R
ikControl   = IKLeg_R
poleControl = PoleLeg_R
switchAttr  = FKIKLeg_R.FKIKBlend
switchFk    = 0
switchIk    = 10

[L_leg]
type        = leg
mode        = position
fkUpper     = FKXHip_L
fkMid       = FKXKnee_L
fkEnd       = FKXAnkle_L
ikUpper     = IKXHip_L
ikMid       = IKXKnee_L
ikEnd       = IKXAnkle_L
ikControl   = IKLeg_L
poleControl = PoleLeg_L
switchAttr  = FKIKLeg_L.FKIKBlend
switchFk    = 0
switchIk    = 10
